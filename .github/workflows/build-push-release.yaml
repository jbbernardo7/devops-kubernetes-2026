name: Build and publish application

on:
  push:
    paths:
     - 'log_output/**'
    branches:
     - '**'
jobs:
  build-publish:
    name: Build, Push, Release
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: log_output

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |-
            reader:
              - 'log_output/log-reader/**'
            writer:
              - 'log_output/log-writer/**'

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # build and publish log-reader
      - name: Build and publish log-reader
        if: steps.changes.outputs.reader == 'true'
        run: |-
          docker build -t jbbernardo7/log-reader:$GITHUB_SHA log-reader/.
          docker push jbbernardo7/log-reader:$GITHUB_SHA

      # build and publish log-writer
      - name: Build and publish log-writer
        if: steps.changes.outputs.writer == 'true'
        run: |-
          docker build -t jbbernardo7/log-writer:$GITHUB_SHA log-writer/.
          docker push jbbernardo7/log-writer:$GITHUB_SHA

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      # Update log-reader image 
      - name: Update log-reader image
        if: steps.changes.outputs.reader == 'true'
        run: kustomize edit set image exercises/log-reader=jbbernardo7/log-reader:$GITHUB_SHA

      # Update log-writer image 
      - name: Update log-writer image
        if: steps.changes.outputs.writer == 'true'
        run: kustomize edit set image exercises/log-writer=jbbernardo7/log-writer:$GITHUB_SHA

      - name: commit kustomization.yaml to GitHub
        uses: EndBug/add-and-commit@v10
        with:
          add: 'log_output/kustomization.yaml'
          message: New version released ${{ github.sha }}