name: Build and publish application

on:
  push:
    paths:
     - 'the_project/**'
    branches:
     - '**'
jobs:
  build-publish:
    name: Build, Push, Release
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: the_project

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |-
            todo-app:
              - 'the_project/todo-app/**'
            todo-backend:
              - 'the_project/todo-backend/**'
            backup-cronjob:
              - 'the_project/backup-cronjob/**'
            broadcaster:
              - 'the_project/broadcaster/**'
            wiki-cronjob:
              - 'the_project/wiki-cronjob/**'

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # build and publish todo-app
      - name: Build and publish todo-app
        if: steps.changes.outputs.todo-app == 'true'
        run: |-
          docker build -t jbbernardo7/todo-app:$GITHUB_SHA todo-app/.
          docker push jbbernardo7/todo-app:$GITHUB_SHA

      # build and publish todo-backend
      - name: Build and publish todo-backend
        if: steps.changes.outputs.todo-backend == 'true'
        run: |-
          docker build -t jbbernardo7/todo-backend:$GITHUB_SHA todo-backend/.
          docker push jbbernardo7/todo-backend:$GITHUB_SHA
        
      # build and publish broadcaster
      - name: Build and publish broadcaster
        if: steps.changes.outputs.broadcaster == 'true'
        run: |-
          docker build -t jbbernardo7/broadcaster:$GITHUB_SHA broadcaster/.
          docker push jbbernardo7/broadcaster:$GITHUB_SHA

      # build and publish wiki-cronjob
      - name: Build and publish wiki-cronjob
        if: steps.changes.outputs.wiki-cronjob == 'true'
        run: |-
          docker build -t jbbernardo7/wiki-cronjob:$GITHUB_SHA wiki-cronjob/.
          docker push jbbernardo7/wiki-cronjob:$GITHUB_SHA

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Update changed images
        run: |
          for svc in $(echo '${{ steps.changes.outputs.changes }}' | jq -r '.[]'); do
            kustomize edit set image exercises/$svc=jbbernardo7/$svc:$GITHUB_SHA
          done

      - name: commit kustomization.yaml to GitHub
        uses: EndBug/add-and-commit@v10
        with:
          add: 'the_project/kustomization.yaml'
          message: New version released ${{ github.sha }}