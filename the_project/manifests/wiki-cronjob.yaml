apiVersion: batch/v1
kind: CronJob
metadata:
  name: wiki-cronjob
  namespace: project
spec:
  schedule: "0 0 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: wiki-cronjob
              image: project/wiki-cronjob
              imagePullPolicy: Always
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 100m
                  memory: 150Mi
          restartPolicy: OnFailure
          