apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-backend-dep
  namespace: project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-backend
  template:
    metadata:
      labels:
        app: todo-backend
    spec:
      containers:
        - name: todo-backend
          image: jbbernardo7/todo-backend:v1.2
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: todo-backend-configmap
            - secretRef:
                name: the-project-secret
---
apiVersion: v1
kind: Service
metadata:
  name: todo-backend-svc
  namespace: project
spec:
  type: ClusterIP
  selector:
    app: todo-backend
  ports:
    - port: 2345
      protocol: TCP
      targetPort: 3000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-backend-configmap
  namespace: project
data:
  HOST: "0.0.0.0"
  PORT: "3000"
